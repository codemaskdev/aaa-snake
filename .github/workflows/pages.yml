# The site, one patch a day: scripts/build-site.mjs writes site/ for today (UTC+3, release-schedule.json) and the
# official Pages actions deploy it. Two scheduled runs a day, 15:30 and 16:30 UTC (18:30 and 19:30 UTC+3), since
# scheduled runs can start late; `npm run publish:day` runs it by hand.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
