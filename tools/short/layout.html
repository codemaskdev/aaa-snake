<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short layout</title>
<style>
  /* One fixed layout for every version's short: 1080 x 1920.
     Safe area: nothing important below y = 1440 (bottom 25 %) or right of x = 918 (right 15 %). */
  :root {
    --bg: #0b0d13;
    --panel: #141824;
    --line: #262c3d;
    --cyan: #00f0ff;
    --yellow: #ffd23f;
    --pink: #ff2e63;
    --text: #e8ecf5;
    --muted: #8a93a8;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
  #card, #game, #counter { position: absolute; left: 54px; width: 810px; box-sizing: border-box; }

  #card { top: 120px; height: 270px; padding: 28px 34px; background: var(--panel); border: 2px solid var(--line); border-left: 8px solid var(--cyan); border-radius: 18px; }
  #card .label { font-size: 26px; letter-spacing: 6px; color: var(--muted); text-transform: uppercase; }
  #card .version { font: 700 74px/1.05 Menlo, monospace; color: var(--cyan); margin-top: 6px; }
  #card .note { font-size: 34px; line-height: 1.25; margin-top: 12px; max-height: 86px; overflow: hidden; }

  #game { top: 420px; height: 864px; border: 0; border-radius: 6px; background: #000; }
  #speed { position: absolute; top: 436px; left: 70px; padding: 6px 16px; border-radius: 10px; background: rgba(0, 0, 0, 0.75); font: 700 34px Menlo, monospace; color: var(--yellow); display: none; }

  #counter { top: 1300px; height: 124px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
  #counter .label { font-size: 26px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; line-height: 1.3; }
  #counter .label small { display: block; font-size: 20px; letter-spacing: 1px; text-transform: none; }
  #counter .value { font: 700 70px Menlo, monospace; color: var(--yellow); }
  #counter.frozen { border-color: var(--yellow); }
</style>
</head>
<body>
  <div id="card">
    <div class="label">Patch notes</div>
    <div class="version" id="version"></div>
    <div class="note" id="note"></div>
  </div>
  <iframe id="game" scrolling="no"></iframe>
  <div id="speed"></div>
  <div id="counter">
    <div class="label">Time to first apple<small id="source"></small></div>
    <div class="value" id="value"></div>
  </div>
<script>
  // The recorder fills these in. Nothing here keeps time by itself.
  window.layout = {
    setup({ version, note, src, source }) {
      document.getElementById('version').textContent = version;
      document.getElementById('note').textContent = note;
      document.getElementById('source').textContent = source;
      document.getElementById('game').src = src;
    },
    setCounter(text, frozen) {
      document.getElementById('value').textContent = text;
      document.getElementById('counter').classList.toggle('frozen', frozen);
    },
    setSpeed(text) {
      const el = document.getElementById('speed');
      el.textContent = text;
      el.style.display = text ? 'block' : 'none';
    },
  };
</script>
</body>
</html>
