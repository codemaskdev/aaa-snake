<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short layout</title>
<style>
  /* One fixed layout for every short: 1080 x 1920.
     Safe area: nothing important below y = 1440 (bottom 25 %) or right of x = 918 (right 15 %). */
  :root {
    --bg: #0b0d13;
    --panel: #141824;
    --line: #262c3d;
    --cyan: #00f0ff;
    --yellow: #ffd23f;
    --pink: #ff2e63;
    --text: #e8ecf5;
    --muted: #8a93a8;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); }
  #card, .game, #bignote, #counter, #premise { position: absolute; left: 54px; width: 810px; box-sizing: border-box; }

  /* The premise (prompt 16): the same first line in every short, from frame 0; the speed badge sits at its right. */
  #premise { top: 44px; height: 60px; padding-right: 150px; font: 700 40px/60px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); white-space: nowrap; overflow: hidden; }

  #card { top: 120px; height: 270px; padding: 28px 34px; background: var(--panel); border: 2px solid var(--line); border-left: 8px solid var(--cyan); border-radius: 18px; }
  /* The patch line ("Patch 1.4: online only."), then the patch note; both shrink to fit (setCard). */
  #card .version { font: 700 46px/1.2 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--cyan); white-space: nowrap; overflow: hidden; }
  #card .note { font-size: 34px; line-height: 1.25; margin-top: 14px; max-height: 86px; overflow: hidden; }

  .game { top: 420px; height: 864px; border: 0; border-radius: 6px; background: #000; }
  .hidden { visibility: hidden; }
  #bignote { top: 420px; height: 864px; padding: 60px 56px; display: flex; flex-direction: column; justify-content: center; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
  #bignote .version { font: 700 64px/1.15 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--cyan); margin: 0 0 34px; }
  #bignote .note { font-size: 58px; line-height: 1.22; font-weight: 600; }
  /* The playback speed sits at the right of the premise line, so it never covers the game (its top bar included). */
  #speed { position: absolute; top: 56px; right: 216px; padding: 4px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.7); font: 700 24px Menlo, monospace; color: var(--yellow); }

  #counter { top: 1300px; height: 124px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
  #counter .label { font-size: 26px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; line-height: 1.3; white-space: nowrap; }
  #counter .label small { display: block; font-size: 20px; letter-spacing: 1px; text-transform: none; }
  #counter .values { font: 700 70px Menlo, monospace; color: var(--yellow); white-space: nowrap; }
  #counter.compare { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; }
  #counter.compare .label { font: 700 26px Menlo, monospace; letter-spacing: 0; color: var(--cyan); text-transform: none; }
  #counter.compare .label small { display: inline; margin-left: 16px; font: 20px "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--muted); }
  #counter.compare .values { font-size: 54px; line-height: 1; }
  #counter .arrow { color: var(--muted); }
  #counter .new { color: var(--pink); }
  #counter.frozen { border-color: var(--yellow); }
</style>
</head>
<body>
  <div id="premise"></div>
  <div id="card">
    <div class="version" id="version"></div>
    <div class="note" id="note"></div>
  </div>
  <iframe class="game hidden" id="prev" scrolling="no"></iframe>
  <iframe class="game" id="game" scrolling="no"></iframe>
  <div id="bignote" class="hidden">
    <div class="version" id="bigversion"></div>
    <div class="note" id="bignotetext"></div>
  </div>
  <div id="speed" class="hidden"></div>
  <div id="counter">
    <div class="label"><span id="clabel"></span><small id="csub"></small></div>
    <div class="values"><span id="value"></span><span class="arrow" id="arrow"></span><span class="new" id="valuenew"></span></div>
  </div>
<script>
  // The recorder fills these in. Nothing here keeps time by itself.
  const $ = id => document.getElementById(id);
  // Shrink an element's font from `start` px, 1px at a time, until its text fits its box (never under `least`).
  function fit(el, start, least) {
    let size = start;
    el.style.fontSize = `${size}px`;
    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > least) el.style.fontSize = `${--size}px`;
  }
  window.layout = {
    load(id, src) { $(id).src = src; },
    // What the top card says: a version and its patch note (note may be empty).
    // The patch line and the note: a text too long for its box gets a smaller font, 1px at a time, until it fits.
    setCard(line, note) {
      $('version').textContent = line;
      $('note').textContent = note;
      fit($('version'), 46, 24);
      fit($('note'), 34, 20);
    },
    setPremise(text) {
      $('premise').textContent = text;
      fit($('premise'), 40, 24);
    },
    // Which of the middle panes shows: 'game', 'prev' or 'note'.
    show(which) {
      $('game').classList.toggle('hidden', which !== 'game');
      $('prev').classList.toggle('hidden', which !== 'prev');
      $('bignote').classList.toggle('hidden', which !== 'note');
    },
    setBigNote(version, note) {
      $('bigversion').textContent = version;
      $('bignotetext').textContent = note;
    },
    // counter: { compare, label, sub, value, newValue, frozen }
    setCounter(c) {
      $('counter').classList.toggle('compare', Boolean(c.compare));
      $('counter').classList.toggle('frozen', Boolean(c.frozen));
      $('clabel').textContent = c.label;
      $('csub').textContent = c.sub || '';
      $('value').textContent = c.value;
      $('arrow').textContent = c.newValue ? ' -> ' : '';
      $('valuenew').textContent = c.newValue || '';
    },
    setSpeed(text) {
      $('speed').textContent = text;
      $('speed').classList.toggle('hidden', !text);
    },
  };
</script>
</body>
</html>
